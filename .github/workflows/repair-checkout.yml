name: UI repair verification
on:
  push:
    branches: [fix/v29-ui-regressions]
    paths: ['.github/workflows/repair-checkout.yml', 'scripts/verify-desktop-layout.mjs', 'scripts/.repair-remaining-fixtures.py', 'src/**']
permissions:
  contents: write
concurrency:
  group: v29-ui-repair
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NODE_LLAMA_CPP_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - name: Apply inspected harness corrections
        if: ${{ hashFiles('scripts/.repair-remaining-fixtures.py') != '' }}
        run: python3 scripts/.repair-remaining-fixtures.py
      - name: Both TypeScript configurations
        id: types
        continue-on-error: true
        run: npm run typecheck
      - name: Previously failing suites
        id: focused
        continue-on-error: true
        run: |
          npx vitest run --maxWorkers=2 --reporter=json --outputFile=/tmp/mlearn-focused-tests.json src/electron/services/pythonBackend.test.ts src/renderer/windows/wordSync/App.test.tsx > /tmp/mlearn-focused-tests.log 2>&1
      - name: Full three-project test suite
        id: full
        continue-on-error: true
        run: npm test -- --maxWorkers=2 --reporter=json --outputFile=/tmp/mlearn-full-tests.json > /tmp/mlearn-full-tests.log 2>&1
      - name: Language packaging and acceptance tooling tests
        id: tooling
        continue-on-error: true
        run: |
          node --test scripts/language-data/*.test.mjs scripts/acceptance/*.test.mjs scripts/clean-electron-output.test.mjs > /tmp/mlearn-tooling-tests.log 2>&1 || { tail -120 /tmp/mlearn-tooling-tests.log; exit 1; }
          tail -12 /tmp/mlearn-tooling-tests.log
      - name: Desktop production build
        id: desktop
        continue-on-error: true
        run: |
          npm run build > /tmp/mlearn-desktop-build.log 2>&1 || { tail -70 /tmp/mlearn-desktop-build.log; exit 1; }
          tail -8 /tmp/mlearn-desktop-build.log
      - name: Mobile compatibility build
        id: mobile
        continue-on-error: true
        run: |
          npm run build:mobile > /tmp/mlearn-mobile-build.log 2>&1 || { tail -70 /tmp/mlearn-mobile-build.log; exit 1; }
          tail -8 /tmp/mlearn-mobile-build.log
      - name: Browser layout regressions
        id: browser
        continue-on-error: true
        env:
          PLAYWRIGHT_PACKAGE_DIR: /tmp/mlearn-browser/node_modules/playwright
        run: |
          npm install --prefix /tmp/mlearn-browser --no-package-lock --ignore-scripts playwright@1.56.1
          node scripts/verify-desktop-layout.mjs
      - name: Print precise test outcomes
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          for p in [Path('/tmp/mlearn-focused-tests.json'),Path('/tmp/mlearn-full-tests.json')]:
            if not p.exists():continue
            d=json.loads(p.read_text());print('\nREPORT',p.name,{k:d.get(k) for k in ['success','numTotalTests','numPassedTests','numFailedTests','numPendingTests']})
            for f in d.get('testResults',[]):
              failed=[a for a in f.get('assertionResults',[]) if a['status']=='failed']
              if f.get('status')=='failed' and not failed:print('SUITE ERROR',f['name'],str(f.get('message',''))[:1000])
              for a in failed:
                print('FAIL',a['fullName']);print(re.sub(r'\x1b\[[0-9;]*m','','\n'.join(a.get('failureMessages',[])))[:1000])
              if p.name=='mlearn-full-tests.json':
                for a in f.get('assertionResults',[]):
                  if a['status'] not in ['passed','failed']:print('NOT RUN',a['status'],a['fullName'])
          PY
          mkdir -p /tmp/mlearn-ui-evidence
          git rev-parse HEAD > /tmp/mlearn-ui-evidence/source-commit.txt
          git diff --binary > /tmp/mlearn-ui-evidence/source.patch
          cp /tmp/mlearn-*-tests.json /tmp/mlearn-*-tests.log /tmp/mlearn-*-build.log /tmp/mlearn-ui-evidence/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-repair-evidence
          path: /tmp/mlearn-ui-evidence/
          retention-days: 7
      - name: Require every verification gate
        if: ${{ !cancelled() && (steps.types.outcome != 'success' || steps.focused.outcome != 'success' || steps.full.outcome != 'success' || steps.tooling.outcome != 'success' || steps.desktop.outcome != 'success' || steps.mobile.outcome != 'success' || steps.browser.outcome != 'success') }}
        run: exit 1
      - name: Persist the verified changes on the repair work branch
        if: ${{ success() && hashFiles('scripts/.repair-remaining-fixtures.py') != '' }}
        run: |
          test "$GITHUB_REF" = refs/heads/fix/v29-ui-regressions
          git diff --check
          git add src/electron/services/pythonBackend.test.ts src/renderer/windows/wordSync/App.test.tsx
          git rm scripts/.repair-remaining-fixtures.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: isolate storage fault injection and installer platform state'
          git push origin HEAD:refs/heads/fix/v29-ui-regressions
          echo "VERIFIED_SOURCE_COMMIT=$(git rev-parse HEAD)"

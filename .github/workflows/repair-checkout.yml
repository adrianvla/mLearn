name: UI repair verification
on:
  push:
    branches: [fix/v29-ui-regressions]
    paths: ['.github/workflows/repair-checkout.yml', 'scripts/verify-desktop-layout.mjs', 'scripts/.resume-repair.py', 'src/**']
permissions:
  contents: write
concurrency:
  group: v29-ui-repair
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NODE_LLAMA_CPP_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - name: Recover the already-persisted patch
        if: ${{ hashFiles('scripts/.resume-repair.py') != '' }}
        run: python3 scripts/.resume-repair.py
      - name: Verify recovered repairs
        run: |
          npm run typecheck
          npx vitest run --maxWorkers=2 applicationNavigation windowFirstPaint ReviewWorkspace StudyEncounter FlashcardReview ReaderNav ReaderStatusBar toolbarOverflow WelcomeLearningSummary WelcomeRoute knowledgeHistoryStore src/electron/services/settings.test.ts readingProsody SubtitleWord.pitchAccent WordEntryRow flashcardsSuggestedPreview memoryBrowser MemoryBrowser.shared > /tmp/mlearn-recovered-tests.log 2>&1 || { tail -100 /tmp/mlearn-recovered-tests.log; exit 1; }
          tail -10 /tmp/mlearn-recovered-tests.log
      - name: Persist verified recovery on the work branch only
        if: ${{ success() && hashFiles('scripts/.resume-repair.py') != '' }}
        run: |
          test "$GITHUB_REF" = refs/heads/fix/v29-ui-regressions
          git diff --check
          while IFS= read -r file; do git add -- "$file"; done < /tmp/mlearn-ui-changed-files.txt
          git rm -- scripts/.apply-v29-ui-repair.py scripts/.apply-repair-correctness.py scripts/.resume-repair.py scripts/.repair-diagnostics.py .github/workflows/repair-probe.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: restore v2.9 layouts, shared memories and archived Undo'
          git push origin HEAD:refs/heads/fix/v29-ui-regressions
          echo "RECOVERED_SOURCE_COMMIT=$(git rev-parse HEAD)"
      - name: Inspect actual storage binding and installer diagnostics
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['node_modules/happy-dom/lib/storage/Storage.js', 'node_modules/happy-dom/lib/storage/StorageFactory.js']:
            p=Path(name)
            if p.exists(): print('\n=== '+name+' ===\n'+p.read_text()[:17000])
          print('\n=== ACCEPTANCE SCRIPTS ===')
          for p in Path('scripts/acceptance').glob('*'): print(p)
          for p in Path('src').rglob('AGENTS.md'):print('NESTED INSTRUCTIONS',p)
          PY
          npx vitest run --maxWorkers=2 src/electron/services/pythonBackend.test.ts > /tmp/mlearn-installer-tests.log 2>&1 || true
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=re.sub(r'\x1b\[[0-9;]*m','',Path('/tmp/mlearn-installer-tests.log').read_text())
          lines=text.splitlines()
          indices=[i for i,l in enumerate(lines) if any(x in l for x in ['FAIL ', '× ', 'Test timed out', 'Failed Tests'])]
          for i in indices:
            print('\n'.join(lines[max(0,i-1):i+10]))
          print('\n=== LAST LOG CONTEXT ===\n'+'\n'.join(lines[-95:]))
          PY
      - name: Archive recovery evidence
        if: always()
        run: |
          mkdir -p /tmp/mlearn-ui-evidence
          git rev-parse HEAD > /tmp/mlearn-ui-evidence/source-commit.txt
          git diff --binary > /tmp/mlearn-ui-evidence/uncommitted.patch
          cp /tmp/mlearn-*-tests.log /tmp/mlearn-ui-evidence/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repair-recovery-evidence
          path: /tmp/mlearn-ui-evidence/
          retention-days: 7

name: UI repair verification
on:
  push:
    branches: [fix/v29-ui-regressions]
    paths:
      - .github/workflows/repair-checkout.yml
      - scripts/verify-desktop-layout.mjs
      - scripts/.apply-v29-ui-repair.py
      - scripts/.repair-diagnostics.py
      - src/**
permissions:
  contents: write
concurrency:
  group: v29-ui-repair
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NODE_LLAMA_CPP_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply exact, inspected source edits
        if: ${{ hashFiles('scripts/.apply-v29-ui-repair.py') != '' }}
        run: python3 scripts/.apply-v29-ui-repair.py
      - name: Install isolated browser verification dependency
        run: npm install --prefix /tmp/mlearn-browser --no-package-lock --ignore-scripts playwright@1.56.1
      - name: Real Chromium layout regression checks
        env:
          PLAYWRIGHT_PACKAGE_DIR: /tmp/mlearn-browser/node_modules/playwright
        run: node scripts/verify-desktop-layout.mjs
      - name: Component and ownership regressions
        run: |
          npx vitest run --maxWorkers=2 applicationNavigation windowFirstPaint ReviewWorkspace StudyEncounter FlashcardReview ReaderNav ReaderStatusBar toolbarOverflow WelcomeLearningSummary WelcomeRoute > /tmp/mlearn-targeted-tests.log 2>&1 || { tail -80 /tmp/mlearn-targeted-tests.log; exit 1; }
          tail -8 /tmp/mlearn-targeted-tests.log
      - name: Both TypeScript configurations
        run: npm run typecheck
      - name: Complete Vitest suite
        id: full
        continue-on-error: true
        run: |
          npx vitest run --maxWorkers=2 --reporter=json --outputFile=/tmp/mlearn-full-tests.json > /tmp/mlearn-full-tests.log 2>&1
      - name: Compare failures against the untouched pinned baseline
        if: ${{ !cancelled() && steps.full.outcome == 'failure' }}
        run: |
          git fetch --depth=1 origin bdbbd7507554e36697c5b6add573c49f59ed6f1e
          mkdir -p /tmp/mlearn-baseline
          git archive bdbbd7507554e36697c5b6add573c49f59ed6f1e | tar -x -C /tmp/mlearn-baseline
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/mlearn-baseline/node_modules
          cd /tmp/mlearn-baseline
          npx --no-install vitest run --maxWorkers=2 --reporter=json --outputFile=/tmp/mlearn-baseline-tests.json SubtitleWord.pitchAccent flashcardsSuggestedPreview src/renderer/windows/wordSync/App.test.tsx WordEntryRow knowledgeHistoryStore pythonBackend src/electron/services/settings.test.ts > /tmp/mlearn-baseline-tests.log 2>&1 || true
      - name: Failure summaries and source ownership
        if: ${{ !cancelled() && hashFiles('scripts/.repair-diagnostics.py') != '' }}
        run: python3 scripts/.repair-diagnostics.py /tmp/mlearn-full-tests.json /tmp/mlearn-baseline-tests.json
      - name: Desktop production build
        if: ${{ !cancelled() }}
        run: |
          npm run build > /tmp/mlearn-desktop-build.log 2>&1 || { tail -100 /tmp/mlearn-desktop-build.log; exit 1; }
          tail -12 /tmp/mlearn-desktop-build.log
      - name: Mobile compatibility build
        if: ${{ !cancelled() }}
        run: |
          npm run build:mobile > /tmp/mlearn-mobile-build.log 2>&1 || { tail -100 /tmp/mlearn-mobile-build.log; exit 1; }
          tail -12 /tmp/mlearn-mobile-build.log
      - name: Record patch and evidence
        if: always()
        run: |
          mkdir -p /tmp/mlearn-ui-evidence
          git diff --binary > /tmp/mlearn-ui-evidence/source.patch
          git diff --stat
          cp /tmp/mlearn-*-tests.json /tmp/mlearn-*-tests.log /tmp/mlearn-*-build.log /tmp/mlearn-ui-evidence/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-ui-evidence
          path: /tmp/mlearn-ui-evidence/
          retention-days: 7
      - name: Require the full suite to pass
        if: ${{ !cancelled() && steps.full.outcome != 'success' }}
        run: exit 1
      - name: Commit only verified source edits to the isolated branch
        if: ${{ success() && hashFiles('scripts/.apply-v29-ui-repair.py') != '' }}
        run: |
          test "$GITHUB_REF" = refs/heads/fix/v29-ui-regressions
          git diff --check
          while IFS= read -r file; do git add -- "$file"; done < /tmp/mlearn-ui-changed-files.txt
          git rm -- scripts/.apply-v29-ui-repair.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: restore compact review, native chrome and Home summary'
          git push origin HEAD:refs/heads/fix/v29-ui-regressions

name: UI repair verification
on:
  push:
    branches: [fix/v29-ui-regressions]
    paths:
      - .github/workflows/repair-checkout.yml
      - scripts/verify-desktop-layout.mjs
      - scripts/.apply-*.py
      - src/**
permissions:
  contents: write
concurrency:
  group: v29-ui-repair
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NODE_LLAMA_CPP_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - name: Reproduce shared-memory omission before applying the fix
        if: ${{ hashFiles('scripts/.apply-repair-correctness.py') != '' }}
        continue-on-error: true
        run: npx vitest run --maxWorkers=2 MemoryBrowser.shared
      - name: Apply exact, inspected source edits
        if: ${{ hashFiles('scripts/.apply-repair-correctness.py') != '' }}
        run: python3 scripts/.apply-repair-correctness.py
      - name: Install isolated browser verification dependency
        run: npm install --prefix /tmp/mlearn-browser --no-package-lock --ignore-scripts playwright@1.56.1
      - name: Real Chromium layout regression checks
        env:
          PLAYWRIGHT_PACKAGE_DIR: /tmp/mlearn-browser/node_modules/playwright
        run: node scripts/verify-desktop-layout.mjs
      - name: Both TypeScript configurations
        id: types
        continue-on-error: true
        run: npm run typecheck
      - name: Complete Vitest suite
        id: full
        continue-on-error: true
        run: npx vitest run --maxWorkers=2 --reporter=json --outputFile=/tmp/mlearn-full-tests.json > /tmp/mlearn-full-tests.log 2>&1
      - name: Bounded failure summaries
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('/tmp/mlearn-full-tests.json')
          if p.exists():
            d=json.loads(p.read_text());print({k:d.get(k) for k in ['numTotalTests','numPassedTests','numFailedTests','numPendingTests']})
            for f in d.get('testResults',[]):
              failures=[x for x in f.get('assertionResults',[]) if x['status']=='failed']
              if not failures:continue
              print('\nFILE',f['name'],'FAILURES',len(failures))
              seen=set()
              for x in failures:
                msg=re.sub(r'\x1b\[[0-9;]*m','','\n'.join(x.get('failureMessages',[])))
                print(x.get('fullName'))
                first=msg.split('\n')[0]
                if first not in seen:print(msg[:2000]);seen.add(first)
          for folder in ['src/renderer/windows/statistics','scripts']:
            print('\nFILES',folder)
            for p in Path(folder).glob('*'):
              if p.is_file() and (folder.endswith('statistics') or any(x in p.name for x in ['desktop','native','restor'])):print(p)
          print('\nARCHIVE BUCKET READS')
          for i,l in enumerate(Path('src/electron/services/knowledgeHistoryStore.ts').read_text().splitlines(),1):
            if 'SELECT' in l and 'bucket' in l:print(i,l)
          PY
      - name: Desktop production build
        id: desktop
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          npm run build > /tmp/mlearn-desktop-build.log 2>&1 || { tail -60 /tmp/mlearn-desktop-build.log; exit 1; }
          tail -8 /tmp/mlearn-desktop-build.log
      - name: Mobile compatibility build
        id: mobile
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          npm run build:mobile > /tmp/mlearn-mobile-build.log 2>&1 || { tail -60 /tmp/mlearn-mobile-build.log; exit 1; }
          tail -8 /tmp/mlearn-mobile-build.log
      - name: Record patch and evidence
        if: always()
        run: |
          mkdir -p /tmp/mlearn-ui-evidence
          git diff --binary > /tmp/mlearn-ui-evidence/source.patch
          git diff --stat
          cp /tmp/mlearn-*-tests.json /tmp/mlearn-*-tests.log /tmp/mlearn-*-build.log /tmp/mlearn-ui-evidence/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-ui-evidence
          path: /tmp/mlearn-ui-evidence/
          retention-days: 7
      - name: Require all verification gates
        if: ${{ !cancelled() && (steps.full.outcome != 'success' || steps.types.outcome != 'success' || steps.desktop.outcome != 'success' || steps.mobile.outcome != 'success') }}
        run: exit 1
      - name: Commit only verified source edits to the isolated branch
        if: ${{ success() && hashFiles('scripts/.apply-repair-correctness.py') != '' }}
        run: |
          test "$GITHUB_REF" = refs/heads/fix/v29-ui-regressions
          git diff --check
          while IFS= read -r file; do git add -- "$file"; done < /tmp/mlearn-ui-changed-files.txt
          git rm -- scripts/.apply-v29-ui-repair.py scripts/.apply-repair-correctness.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: restore compact desktop UI and repair archived Undo'
          git push origin HEAD:refs/heads/fix/v29-ui-regressions

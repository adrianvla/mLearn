name: v3 native mobile build
on:
  push:
    branches: [work/v3-foundation, rewrite/v3]
    paths: ['.github/workflows/v3-mobile.yml', 'crates/**', 'tools/build-mobile.mjs', 'tools/prepare-plugins.mjs', 'language-plugins/**', 'apps/client/**', 'packages/**', 'package-lock.json', 'Cargo.lock']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v3-mobile-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Record exact mobile source
        run: |
          mkdir -p verification
          git rev-parse HEAD HEAD^{tree} | tee verification/source.txt
          git archive --format=tar HEAD -o verification/source.tar
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { cache-on-failure: true }
      - run: npm ci
      - run: npm run prepare:ios
      - name: Generate and compile native simulator app
        working-directory: apps/client
        env: { CI: '1' }
        run: |
          npx expo prebuild --platform ios --no-install
          cd ios
          pod install
          workspace=$(find . -maxdepth 1 -name '*.xcworkspace' -print -quit)
          scheme=$(basename "$workspace" .xcworkspace)
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || { tail -150 build.log; exit 1; }
      - name: Ensure build did not modify tracked source
        if: always()
        run: git diff --exit-code HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-evidence
          path: |
            apps/client/modules/mlearn-native/ios/generated/*.swift
            apps/client/modules/mlearn-native/ios/generated/*.h
            apps/client/ios/Podfile.lock
            apps/client/ios/build.log
            verification
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Record exact mobile source
        run: |
          mkdir -p verification
          git rev-parse HEAD HEAD^{tree} | tee verification/source.txt
          git archive --format=tar HEAD -o verification/source.tar
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { cache-on-failure: true }
      - run: npm ci
      - run: cargo install cargo-ndk --locked
      - name: Select installed Android NDK
        run: |
          ndk=$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -n "$ndk"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
      - run: npm run prepare:android
      - name: Generate and compile Android application
        working-directory: apps/client
        env: { CI: '1' }
        run: |
          npx expo prebuild --platform android --no-install
          cd android
          ./gradlew assembleDebug --no-daemon --console=plain > build.log 2>&1 || { tail -150 build.log; exit 1; }
      - name: Ensure build did not modify tracked source
        if: always()
        run: git diff --exit-code HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-evidence
          path: |
            apps/client/modules/mlearn-native/android/generated
            apps/client/android/build.log
            verification

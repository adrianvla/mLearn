name: v3 foundation
on:
  push:
    branches: [work/v3-foundation, rewrite/v3]
  pull_request:
    branches: [rewrite/v3]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v3-foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tools/checks/*.test.mjs
      - run: npm run build:web
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p mlearn-core -p mlearn-language-host

name: v3 foundation
on:
  push:
    branches: ['agent/**', rewrite/v3]
    paths: ['.github/workflows/v3-foundation.yml', 'apps/**', 'packages/**', 'resources/**', 'tools/**', 'tests/**', 'language-plugins/**', 'crates/**', 'package.json', 'package-lock.json', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'tsconfig*', 'playwright.config.ts']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v3-foundation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Record exact source under test
        run: |
          mkdir -p verification
          git rev-parse HEAD HEAD^{tree} | tee verification/source.txt
          git status --porcelain=v1 | tee verification/start-status.txt
          git archive --format=tar HEAD -o verification/source.tar
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Provide Linux CJK fonts for vertical source text
        run: |
          sudo apt-get install -y fonts-noto-cjk
          # Playwright's legacy WenQuanYi face has zero CJK vertical advances.
          sudo apt-get remove -y fonts-wqy-zenhei
          fc-list :lang=ja file > verification/cjk-fonts.txt
          fc-match 'Arial:lang=ja' > verification/cjk-font-match.txt
          test -s verification/cjk-fonts.txt
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build:web
      - run: npm run test:web
      - name: Ensure checks did not modify tracked source
        if: always()
        run: git diff --exit-code HEAD
      - name: Capture dependency audit without automatic fixes
        if: always()
        run: npm audit --json > npm-audit.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-inspection
          path: |
            test-results
            apps/client/dist
            npm-audit.json
            package-lock.json
            verification
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Record native source and toolchain
        run: |
          mkdir -p verification
          git rev-parse HEAD HEAD^{tree} | tee verification/source.txt
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { cache-on-failure: true }
      - name: Acquire and verify pinned language data
        timeout-minutes: 15
        shell: bash
        run: |
          set -o pipefail
          npm run prepare:language-data 2>&1 | tee verification/prepare-language-data.log
      - run: node tools/prepare-plugins.mjs
      - run: node tools/prepare-documents.mjs
      - run: cargo test --locked --workspace --exclude mlearn-desktop --exclude mlearn-ffi --exclude mlearn-bindgen
      - run: cargo run --locked -p mlearn-core --features typescript --example export_contracts -- --check
      - run: cargo check --locked -p mlearn-ffi --features mobile-bundle
      - name: Ensure native checks did not modify tracked source
        if: always()
        run: git diff --exit-code HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-build-data
          path: |
            target/plugin-cdn
            Cargo.lock
            packages/contracts/src/generated.ts
            verification
  ocr-detector:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Convert the exact original tuned detector offline
        shell: bash
        run: |
          set -euo pipefail
          directory=target/native-ocr-detector
          mkdir -p "$directory/source"
          base=https://huggingface.co/PaddlePaddle/PP-OCRv6_medium_det/resolve/8e0f56fb2ef86b461d99cfc7ac5c137738985f61
          for file in inference.json inference.pdiparams inference.yml; do
            curl --fail --location --max-time 300 "$base/$file" --output "$directory/source/$file"
          done
          # Retain the measured ONNX pin despite paddle2onnx's <=1.17 metadata.
          # Resolve its other dependencies explicitly; bypass only its resolver.
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.2 onnx==1.23.2 numpy==2.3.5 onnxoptimizer==0.3.13 'polygraphy>=0.49.20' packaging
          python -m pip install --disable-pip-version-check --no-deps paddle2onnx==2.1.0
          # The converter rejects any mismatch against all three measured input
          # hashes before export. Python is absent from the consuming app path.
          python tools/convert-desktop-detector.py "$directory/source" "$directory/detector.onnx" 2>&1 | tee "$directory/conversion.log"
          sha256sum "$directory/detector.onnx" > "$directory/detector.sha256"
          sha256sum "$directory"/source/inference.* > "$directory/inputs.sha256"
          curl --fail --location --max-time 60 https://raw.githubusercontent.com/PaddlePaddle/PaddleOCR/v3.7.0/LICENSE --output "$directory/PaddleOCR-LICENSE.txt"
          printf '3840c5c0c61c294264d2dd77b8777be6ddd90121ef4e0e64abcd22edea581d6e  %s\n' "$directory/PaddleOCR-LICENSE.txt" | sha256sum --check
      - uses: actions/upload-artifact@v4
        with:
          name: native-ocr-detector
          path: |
            target/native-ocr-detector/detector.onnx
            target/native-ocr-detector/detector.sha256
            target/native-ocr-detector/inputs.sha256
            target/native-ocr-detector/conversion.log
            target/native-ocr-detector/PaddleOCR-LICENSE.txt
  desktop:
    needs: [rust, ocr-detector]
    # Detector failure must not skip independent builds and generic OCR.
    # The detector job and missing Japanese artifact remain failing gates.
    if: ${{ !cancelled() && needs.rust.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { cache-on-failure: true }
      - run: npm ci
      - run: npm run build:web
      - run: npm run tauri -w @mlearn/desktop -- build --debug --no-bundle
      - run: cargo test --locked -p mlearn-desktop --lib
      - name: Verify portable offline PDF rasterization
        run: cargo test --locked -p mlearn-desktop-ocr --all-targets
      - uses: actions/download-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: foundation-build-data
          path: native-ocr-foundation
      - name: Prepare pinned authenticated Windows OCR inputs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/plugin-cdn | Out-Null
          Copy-Item native-ocr-foundation/target/plugin-cdn/* target/plugin-cdn -Recurse -Force
          ./tools/prepare-windows-ocr.ps1
      - name: Execute real Windows OCR and persistence workflows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo test --locked -p mlearn-runtime --lib native_ocr::tests
          cargo test --locked -p mlearn-runtime --test document
          cargo build --locked -p mlearn-desktop --features ocr-probe --example ocr_probe
          node tools/verify-desktop-ocr.mjs test-results/native-ocr generic
      - uses: actions/download-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: native-ocr-detector
          path: target/native-ocr-detector
      - name: Execute the original tuned Japanese pipeline on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          ./tools/prepare-windows-ocr.ps1 -Profile manga -DetectorDirectory target/native-ocr-detector
          node tools/verify-desktop-ocr.mjs test-results/native-ocr-manga
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: windows-native-ocr
          path: |
            test-results/native-ocr/desktop-ocr-results.json
            test-results/native-ocr/native-pixel-display.png
            test-results/native-ocr-manga/desktop-ocr-results.json
            test-results/native-ocr-manga/native-pixel-display.png
            target/native-ocr-qa/package-generic/artifacts.json
            target/native-ocr-qa/package-manga/artifacts.json
            target/native-ocr-qa/models-generic/provenance.json
            target/native-ocr-qa/models-manga/provenance.json
      - name: Exercise actual Windows native theme materials
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force verification | Out-Null
          New-Item -ItemType Directory -Force test-results/window-materials | Out-Null
          git rev-parse HEAD 'HEAD^{tree}' | Set-Content verification/source.txt
          powershell.exe -Mta -NoProfile -ExecutionPolicy Bypass -File tests/desktop/window-materials.ps1 2>&1 | Tee-Object test-results/window-materials/run.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Ensure desktop build did not modify tracked source
        if: always()
        run: git diff --exit-code HEAD
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: windows-native-materials
          path: |
            test-results/window-materials
            verification

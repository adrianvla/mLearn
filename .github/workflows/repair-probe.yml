name: Repair root-cause probes
on:
  push:
    branches: [fix/v29-ui-regressions]
    paths: [.github/workflows/repair-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NODE_LLAMA_CPP_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts
      - name: Inspect SQLite's embedded NUL transport
        run: |
          node --input-type=module <<'JS'
          import {DatabaseSync} from 'node:sqlite';
          const db=new DatabaseSync(':memory:');
          const value='surface-reading\0legacy';
          const row=db.prepare('SELECT ? AS text, CAST(? AS BLOB) AS bytes').get(value,value);
          console.log(JSON.stringify({input:value,text:row.text,decoded:Buffer.from(row.bytes).toString('utf8')}));
          db.close();
          JS
      - name: Capture focused source context
        run: |
          python3 - <<'PY'
          from pathlib import Path
          tasks={
            'src/renderer/windows/wordSync/App.test.tsx':[(640,718),(2700,2920)],
            'src/renderer/windows/wordDbEditor/components/WordEntryRow.test.tsx':[(195,262)],
            'src/renderer/windows/memoryBrowser/App.tsx':[(135,212)],
            'src/electron/services/pythonBackend.test.ts':[(275,316),(1138,1230)],
          }
          for file,ranges in tasks.items():
            lines=Path(file).read_text().splitlines();print('\n===',file,'===')
            for a,b in ranges:
              for i in range(a-1,min(b,len(lines))):print(f'{i+1}: {lines[i]}')
          for file,terms in {
            'src/renderer/windows/wordSync/App.tsx':['handleRestart','resetSession','FinishedTitle','isFinished','finishSession'],
            'src/electron/services/pythonBackend.ts':['verify','Verification','pip check','-c'],
          }.items():
            print('\n===',file,'===');lines=Path(file).read_text().splitlines()
            for term in terms:print(term, [(i+1,line.strip()[:180]) for i,line in enumerate(lines) if term in line][:35])
          PY
      - name: Test archive byte-preserving bucket reads
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/electron/services/knowledgeHistoryStore.ts');s=p.read_text()
          before="SELECT DISTINCT bucket, seq FROM attempt_index WHERE key = ? AND attempt_id IN (${placeholders})"
          assert s.count(before)==1
          s=s.replace(before,"SELECT DISTINCT CAST(bucket AS BLOB) AS bucket, seq FROM attempt_index WHERE key = ? AND attempt_id IN (${placeholders})")
          before=".all(key, ...retractedIds) as Array<{ bucket: string; seq: number }>) {\n      const seqs = affected.get(row.bucket) ?? new Set<number>();\n      seqs.add(row.seq);\n      affected.set(row.bucket, seqs);"
          assert s.count(before)==1
          s=s.replace(before,".all(key, ...retractedIds) as Array<{ bucket: Uint8Array; seq: number }>) {\n      const bucket = Buffer.from(row.bucket).toString('utf8');\n      const seqs = affected.get(bucket) ?? new Set<number>();\n      seqs.add(row.seq);\n      affected.set(bucket, seqs);")
          p.write_text(s)
          PY
          npx vitest run --maxWorkers=2 knowledgeHistoryStore > /tmp/archive-probe.log 2>&1 || { tail -100 /tmp/archive-probe.log; exit 1; }
          tail -12 /tmp/archive-probe.log
      - name: Isolate Word Sync failures without leaked storage spies
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/renderer/windows/wordSync/App.test.tsx');s=p.read_text();s=s.replace('    while (disposals.length) disposals.pop()!();','    while (disposals.length) disposals.pop()!();\n    vi.restoreAllMocks();');p.write_text(s)
          PY
          npx vitest run --maxWorkers=2 --reporter=json --outputFile=/tmp/word-sync-probe.json src/renderer/windows/wordSync/App.test.tsx >/tmp/word-sync-probe.log 2>&1 || true
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/word-sync-probe.json'));print({k:d[k] for k in ['numTotalTests','numPassedTests','numFailedTests']})
          for f in d['testResults']:
            for a in f.get('assertionResults',[]):
              if a['status']=='failed':print(a['fullName'], '\n', '\n'.join(a['failureMessages'])[:650])
          PY

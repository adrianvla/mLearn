name: Management Backend Lint

on:
  pull_request:
    paths:
      - 'management/backend/**'
      - 'management/frontend/**'
      - 'management/docker-compose.yml'
      - 'management/frontend/package-lock.json'
      - 'management/backend/Cargo.lock'
      - 'src/html/assets/icons/logo.png'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/management-lint.yml'
  push:
    branches:
      - main
      - dev
    paths:
      - 'management/backend/**'
      - 'management/frontend/**'
      - 'management/docker-compose.yml'
      - 'management/frontend/package-lock.json'
      - 'management/backend/Cargo.lock'
      - 'src/html/assets/icons/logo.png'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/management-lint.yml'

permissions:
  contents: read

jobs:
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install embedded management console dependencies
        working-directory: management/frontend
        run: npm ci --no-audit --no-fund
      - name: Typecheck and test the management console
        working-directory: management/frontend
        run: |
          npm run typecheck
          npm test
      - name: Build the embedded management console
        working-directory: management/frontend
        run: npm run build
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy
      - name: Lint every management backend target
        run: npm run lint:management
      - name: Test every management backend target
        run: npm run test:management
      - name: Build the deployable management image
        run: docker build --tag mlearn-management-ci --file management/backend/Dockerfile .

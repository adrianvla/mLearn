name: v3 real desktop integration
on:
  push:
    branches: ['agent/**', rewrite/v3]
    paths: ['.github/workflows/v3-desktop-e2e.yml', 'apps/client/**', 'apps/desktop/**', 'tests/desktop/**', 'crates/**', 'packages/**', 'tools/**', 'language-plugins/**', 'Cargo.toml', 'Cargo.lock', 'package.json', 'package-lock.json', 'resources/**', 'rust-toolchain.toml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v3-desktop-e2e-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      WEBKIT_DISABLE_COMPOSITING_MODE: '1'
      XDG_DATA_HOME: ${{ github.workspace }}/.mlearn/e2e-data
      XDG_CONFIG_HOME: ${{ github.workspace }}/.mlearn/e2e-config
      MLEARN_MEDIA_TRACE: ${{ github.workspace }}/test-results/desktop/media-requests.log
      GST_DEBUG: '2,webkitwebsrc:5'
    steps:
      - uses: actions/checkout@v4
      - name: Record exact source under native acceptance
        run: |
          mkdir -p verification test-results/desktop
          git rev-parse HEAD HEAD^{tree} | tee verification/source.txt
          git archive --format=tar HEAD -o verification/source.tar
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { cache-on-failure: true }
      - name: Install bounded Linux native dependencies
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          bash tools/configure-ci-apt.sh
          timeout 120s sudo apt-get update
          packages=(libwebkit2gtk-4.1-dev libgstreamer-plugins-bad1.0-dev libappindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb dbus-x11 ffmpeg gstreamer1.0-libav gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-tools fontconfig fonts-noto-cjk)
          timeout 360s sudo apt-get --download-only install -y "${packages[@]}"
          sudo apt-get --no-download install -y "${packages[@]}"
      - name: Verify real Japanese glyph coverage
        run: |
          fc-list :lang=ja file > verification/cjk-fonts.txt
          test -s verification/cjk-fonts.txt
      - run: npm ci
      - name: Acquire and verify pinned language data
        timeout-minutes: 15
        shell: bash
        run: |
          set -o pipefail
          npm run prepare:language-data 2>&1 | tee verification/prepare-language-data.log
      - run: python3 tools/create-watch-fixture.py .mlearn/m01-ci-fixtures
      - name: Verify actual fixture decoder chain
        run: |
          for element in qtdemux h264parse avdec_h264; do gst-inspect-1.0 "$element"; done > verification/gstreamer-chain.txt
          gst-launch-1.0 -q filesrc location=.mlearn/m01-ci-fixtures/watch-fixture.mp4 ! qtdemux name=d d.video_0 ! h264parse ! avdec_h264 ! fakesink
      - run: npm run build:plugin
      - run: npm run tauri -w @mlearn/desktop -- build --debug --no-bundle
      - run: cargo install tauri-driver --locked
      - name: Exercise real IPC, plugin download and restart
        shell: bash
        run: |
          set -o pipefail
          dbus-run-session -- xvfb-run -a node tests/desktop/native-smoke.mjs 2>&1 | tee test-results/desktop/run.log
      - name: Ensure native acceptance did not modify tracked source
        if: always()
        run: git diff --exit-code HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-desktop-evidence
          path: |
            test-results/desktop
            verification

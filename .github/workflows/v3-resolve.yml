name: v3 foundation lock generation
on:
  push:
    branches: [work/v3-foundation]
    paths: ['.github/workflows/v3-resolve.yml', 'package.json', 'apps/client/package.json', 'packages/*/package.json', '**/Cargo.toml', 'crates/core/src/lib.rs']
permissions:
  contents: write
concurrency:
  group: v3-foundation-locks
  cancel-in-progress: false
jobs:
  generate:
    if: github.repository == 'adrianvla/mLearn' && github.ref == 'refs/heads/work/v3-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve manifests without running npm lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts
      - run: cargo generate-lockfile
      - run: cargo run -p mlearn-core --features typescript --example export_contracts
      - name: Commit generated outputs only, with branch lease
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/work/v3-foundation | cut -f1)" = "$EXPECTED_SHA"
          git add package-lock.json Cargo.lock packages/contracts/src/generated.ts
          git diff --cached --quiet && exit 0
          git config user.name 'mLearn dependency generation'
          git config user.email '86854740+adrianvla@users.noreply.github.com'
          git commit -m 'chore(v3): lock dependency graph and generate native contracts'
          git push origin HEAD:work/v3-foundation

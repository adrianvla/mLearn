appId: net.kikan.mlearn.v3dev
name: Native foundation persists Rust state across process restart
---
# Run against a locally compiled Release app. No Metro, Expo Go, EAS, mocked
# transport or JavaScript persistence. All test data belongs to this v3 app.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Plugin code: mobile-bundled'
    timeout: 60000
- assertVisible: 'Expo native'
- takeScreenshot: initial-quartz
- scrollUntilVisible:
    element: 'Run hello'
    direction: DOWN
- tapOn: 'Run hello'
- scrollUntilVisible:
    element:
      id: runtime-message
    direction: DOWN
- assertVisible: 'Hello, world!'
- takeScreenshot: bundled-plugin-result
- scrollUntilVisible:
    element: 'Slate'
    direction: DOWN
- assertVisible: 'Current: Quartz\. Saved in the native SQLite profile\.'
- tapOn: 'Slate'
- extendedWaitUntil:
    visible: 'Current: Slate\. Saved in the native SQLite profile\.'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: runtime-message
    direction: DOWN
- assertVisible: 'Theme saved by Rust · revision [1-9][0-9]*'
- takeScreenshot: saved-slate
- scrollUntilVisible:
    element: 'One app\. Native at the core\.'
    direction: UP
- takeScreenshot: slate-before-restart
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: 'Plugin code: mobile-bundled'
    timeout: 60000
- takeScreenshot: slate-after-restart
- scrollUntilVisible:
    element: 'Slate'
    direction: DOWN
- assertVisible: 'Current: Slate\. Saved in the native SQLite profile\.'
- assertNotVisible: 'Unsaved visual preview.*'
- scrollUntilVisible:
    element: 'Edit theme JSON'
    direction: DOWN
- tapOn: 'Edit theme JSON'
- assertVisible: 'Custom theme'
- assertVisible: 'Theme JSON'
- takeScreenshot: custom-theme-dialog
# Focus first: on iOS the first long press on an unfocused input only places
# the cursor. Select the document rather than issuing thousands of backspaces.
- tapOn:
    id: theme-json-input
- longPressOn:
    id: theme-json-input
- tapOn: 'Select [Aa]ll'
- eraseText: 1
# Compact JSON preserves the same native rejection while keeping typing within
# Maestro's 120-second Android RPC deadline on a software-rendered emulator.
- inputText: '{"schemaVersion":1,"id":"mlearn.slate","name":" ","colors":{"background":"#15191F","surface":"#20262E","text":"#EDF0F5","muted":"#BAC2CE","accent":"#99BEFF","onAccent":"#15243C","border":"#414B5A"},"radius":12,"textScale":1,"extensions":{}}'
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: 'Done'
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- scrollUntilVisible:
    element: 'Save custom theme'
    direction: DOWN
- tapOn: 'Save custom theme'
- scrollUntilVisible:
    element: 'Theme name must contain.*'
    direction: DOWN
- assertVisible: 'Theme name must contain.*'
- assertVisible: 'Custom theme'
- takeScreenshot: rejected-native-theme
- tapOn: 'Close'
- assertNotVisible: 'Custom theme'
- assertVisible: 'Current: Slate\. Saved in the native SQLite profile\.'
- scrollUntilVisible:
    element: 'world'
    direction: UP
- tapOn: 'world'
- eraseText: 5
- inputText: 'Ada'
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: 'Done'
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- scrollUntilVisible:
    element: 'Run hello'
    direction: DOWN
- tapOn: 'Run hello'
- scrollUntilVisible:
    element:
      id: runtime-message
    direction: DOWN
- assertVisible: 'Hello, Ada!'
- takeScreenshot: edited-native-input-result

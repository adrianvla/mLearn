appId: net.kikan.mlearn.v3dev
name: Native foundation persists Rust state across process restart
---
# Run against a locally compiled Release app. No Metro, Expo Go, EAS, mocked
# transport or JavaScript persistence. All test data belongs to this v3 app.
- launchApp:
    clearState: true
- tapOn: 'Settings'
- tapOn: 'Runtime'
- extendedWaitUntil:
    visible: 'Plugin code: mobile-bundled'
    timeout: 60000
- assertVisible: 'Expo native'
- takeScreenshot: initial-quartz
- scrollUntilVisible:
    element: 'Run hello'
    direction: DOWN
- tapOn: 'Run hello'
- scrollUntilVisible:
    element:
      id: runtime-message
    direction: DOWN
- assertVisible: 'Hello, world!'
- takeScreenshot: bundled-plugin-result
- tapOn: 'Appearance'
- scrollUntilVisible:
    element: 'Slate'
    direction: DOWN
- assertVisible: 'Current: Quartz\. Saved in the native SQLite profile\.'
- tapOn: 'Slate'
- extendedWaitUntil:
    visible: 'Current: Slate\. Saved in the native SQLite profile\.'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: runtime-message
    direction: DOWN
- assertVisible: 'Theme saved by Rust · revision [1-9][0-9]*'
- takeScreenshot: saved-slate
- scrollUntilVisible:
    element: 'Settings'
    direction: UP
- takeScreenshot: slate-before-restart
- stopApp
- launchApp:
    clearState: false
- tapOn: 'Settings'
- tapOn: 'Runtime'
- extendedWaitUntil:
    visible: 'Plugin code: mobile-bundled'
    timeout: 60000
- takeScreenshot: slate-after-restart
- tapOn: 'Appearance'
- scrollUntilVisible:
    element: 'Slate'
    direction: DOWN
- assertVisible: 'Current: Slate\. Saved in the native SQLite profile\.'
- assertNotVisible: 'Unsaved visual preview.*'
- scrollUntilVisible:
    element: 'Edit theme JSON'
    direction: DOWN
- tapOn: 'Edit theme JSON'
- assertVisible: 'Custom theme'
- assertVisible: 'Theme JSON'
- takeScreenshot: custom-theme-dialog
# Maestro's iOS 27 long press places a caret without opening the edit menu.
# Tap the same visible leading-text position again to open its native menu.
# Remove this gesture workaround when longPressOn opens that menu reliably.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: theme-json-input
          point: "10%,5%"
      - tapOn:
          id: theme-json-input
          point: "10%,5%"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: theme-json-input
      - longPressOn:
          id: theme-json-input
- tapOn: 'Select [Aa]ll'
- eraseText: 1
# The pinned iOS XCTest driver drops characters in bulk inputText, even in
# eight-character batches. Enter this bounded fixture once per character and
# acknowledge the native value before continuing; never retry a lost character.
# Remove this workaround after the pinned toolchain passes bulk-input round-trip.
- evalScript: ${output.document = '{"schemaVersion":1,"id":"mlearn.slate","name":" ","colors":{"background":"#15191F","surface":"#20262E","text":"#EDF0F5","muted":"#BAC2CE","accent":"#99BEFF","onAccent":"#15243C","border":"#414B5A"},"radius":12,"textScale":1,"extensions":{}}'; output.characters = output.document.split(''); output.index = 0; output.entered = ''}
- runFlow:
    when:
      platform: iOS
    commands:
      - repeat:
          times: ${output.characters.length}
          commands:
            - inputText: ${output.characters[output.index]}
            - evalScript: ${output.entered += output.characters[output.index]}
            - copyTextFrom:
                id: theme-json-input
            - assertTrue: ${maestro.copiedText === output.entered}
            - evalScript: ${output.index += 1}
      - tapOn: 'Done'
- runFlow:
    when:
      platform: Android
    commands:
      - inputText: ${output.document}
      - hideKeyboard
- copyTextFrom:
    id: theme-json-input
- assertTrue: ${maestro.copiedText === output.document}
- scrollUntilVisible:
    element: 'Save custom theme'
    direction: DOWN
- tapOn: 'Save custom theme'
- scrollUntilVisible:
    element: 'Theme name must contain.*'
    direction: DOWN
- assertVisible: 'Theme name must contain.*'
- assertVisible: 'Custom theme'
- takeScreenshot: rejected-native-theme
- assertVisible:
    id: dialog-surface
- tapOn: 'Close'
- assertNotVisible:
    id: dialog-surface
- assertVisible: 'Current: Slate\. Saved in the native SQLite profile\.'
- tapOn: 'Runtime'
- scrollUntilVisible:
    element: 'world'
    direction: UP
- tapOn: 'world'
- eraseText: 5
- runFlow:
    when:
      platform: iOS
    commands:
      - inputText: 'A'
      - assertVisible: '^A$'
      - inputText: 'd'
      - assertVisible: '^Ad$'
      - inputText: 'a'
      - assertVisible: '^Ada$'
      - tapOn: 'Done'
- runFlow:
    when:
      platform: Android
    commands:
      - inputText: 'Ada'
      - hideKeyboard
- scrollUntilVisible:
    element: 'Run hello'
    direction: DOWN
- tapOn: 'Run hello'
- scrollUntilVisible:
    element:
      id: runtime-message
    direction: DOWN
- assertVisible: 'Hello, Ada!'
- takeScreenshot: edited-native-input-result

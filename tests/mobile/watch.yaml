appId: net.kikan.mlearn.v3dev
name: Watch Inspector Knowledge and native source resume
---
- launchApp:
    clearState: false
    # Document pickers need no runtime grants; avoid Maestro 2.11's whole-APK
    # permission discovery, active during the ADB failure in run39084979320.
    permissions: {}
- extendedWaitUntil:
    # Android labels can report enabled before their disabled parent is ready.
    # Package selection also settles the bootstrap layout before the Open tap.
    visible:
      id: language-org.mlearn.english
      selected: true
    timeout: 60000
- extendedWaitUntil:
    # Home renders this control disabled while language packages initialize.
    visible:
      text: Open local video
      enabled: true
    timeout: 60000
- tapOn: Get language packages
- assertNotVisible: Check for packages
- tapOn: Home
- runFlow:
    when:
      platform: Android
    file: watch/open-android.yaml
- runFlow:
    when:
      platform: iOS
    file: watch/open-ios.yaml
- extendedWaitUntil:
    visible: 'Children: (untracked|mixed)'
    timeout: 60000
- takeScreenshot: annotated-subtitles
- tapOn: 'Children: (untracked|mixed)'
- extendedWaitUntil:
    visible: child
    timeout: 60000
- tapOn: 'Adjust Meaning knowledge(,.*)?'
- scrollUntilVisible:
    element: 'Claim Meaning unknown'
    direction: DOWN
- tapOn: 'Claim Meaning unknown'
- extendedWaitUntil:
    visible: 'Meaning · claimed unknown'
    timeout: 15000
- tapOn: 'Claim Meaning known'
- extendedWaitUntil:
    visible: 'Meaning · claimed known'
    timeout: 15000
- tapOn: 'Withdraw Meaning claim'
- extendedWaitUntil:
    visible: 'Meaning · untracked'
    timeout: 15000
- tapOn: 'Claim Meaning known'
- extendedWaitUntil:
    visible: 'Meaning · claimed known'
    timeout: 15000
- takeScreenshot: claimed-meaning
- tapOn: Close Inspector
- assertVisible: 'Children: mixed'
- runFlow:
    file: watch/preferences.yaml
- tapOn: Home
- tapOn: Resume m01-watch.mp4
- extendedWaitUntil:
    visible: 'Children: mixed'
    timeout: 15000
- runFlow:
    when:
      platform: Android
    file: watch/player-android.yaml
- runFlow:
    when:
      platform: iOS
    file: watch/player-ios.yaml

appId: net.kikan.mlearn.v3dev
name: Reader opens local EPUB and preserves authored source readings
---
- stopApp
- launchApp:
    clearState: false
    permissions: {}
- extendedWaitUntil:
    visible: Material
    timeout: 60000
- scrollUntilVisible:
    element:
      id: reader-open-document
    direction: DOWN
    timeout: 60000
    centerElement: false
- extendedWaitUntil:
    visible:
      id: reader-open-document
      enabled: true
    timeout: 15000
- takeScreenshot: reader-document-entry
- tapOn:
    id: reader-open-document
- tapOn: Browse
- runFlow:
    when:
      visible:
        id: DOC.sidebar.item.On My iPhone
    commands:
      - tapOn:
          id: DOC.sidebar.item.On My iPhone
- runFlow:
    when:
      visible:
        id: 'mLearn v3 Dev, Container'
    commands:
      - tapOn:
          id: 'mLearn v3 Dev, Container'
- extendedWaitUntil:
    visible: m05-journey.epub
    timeout: 15000
- tapOn: m05-journey.epub
- extendedWaitUntil:
    visible:
      id: reader-title
      text: m05-journey.epub
    timeout: 60000
- tapOn: Contents
- tapOn: A small journey
- extendedWaitUntil:
    visible:
      id: reader-document-ready
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: reader-position
      text: '.*opening.*'
    timeout: 60000
- extendedWaitUntil:
    visible: A small journey
    timeout: 15000
- takeScreenshot: reader-epub-first-passage
- tapOn: Next passage
- extendedWaitUntil:
    visible:
      id: reader-position
      text: '.*seed.*'
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: reader-document-ready
    timeout: 60000
- extendedWaitUntil:
    visible: とうきょう
    timeout: 15000
- takeScreenshot: reader-epub-authored-ruby
- tapOn: Save position
- tapOn: Home
- stopApp
- launchApp:
    clearState: false
    permissions: {}
- scrollUntilVisible:
    element: Resume m05-journey.epub
    direction: DOWN
    timeout: 60000
    centerElement: false
- tapOn: Resume m05-journey.epub
- extendedWaitUntil:
    visible:
      id: reader-position
      text: '.*seed.*'
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: reader-document-ready
    timeout: 60000
- takeScreenshot: reader-epub-restarted-position

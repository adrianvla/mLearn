appId: net.kikan.mlearn.v3dev
---
- tapOn:
    text: Open local video
    enabled: true
- tapOn: Browse
- runFlow:
    when:
      visible:
        id: 'DOC.sidebar.item.On My iPhone'
    commands:
      - tapOn:
          id: 'DOC.sidebar.item.On My iPhone'
      - extendedWaitUntil:
          # Files may restore the app container or fixture directory directly.
          # Wait for a usable location, then keep the exact fixture selection below.
          visible:
            id: '(mLearn v3 Dev, Container|M01 fixtures, Folder|m01-watch, mp4)'
          timeout: 15000
- runFlow:
    when:
      visible:
        id: 'mLearn v3 Dev, Container'
    commands:
      - tapOn:
          id: 'mLearn v3 Dev, Container'
      - extendedWaitUntil:
          visible:
            id: 'M01 fixtures, Folder'
          timeout: 15000
- runFlow:
    when:
      visible:
        id: 'M01 fixtures, Folder'
    commands:
      - tapOn:
          id: 'M01 fixtures, Folder'
      - extendedWaitUntil:
          visible:
            id: 'm01-watch, mp4'
          timeout: 15000
- tapOn:
    # The Files cell includes filename/metadata below its interactive preview.
    id: 'm01-watch, mp4'
    enabled: true
    point: 50%, 25%
- extendedWaitUntil:
    visible: '(Open|Replace) subtitles'
    timeout: 60000
- runFlow:
    when:
      notVisible:
        id: Play/Pause
    commands:
      - tapOn:
          text: Local video player
          point: 50%, 38%
- repeat:
    times: 3
    commands:
      - tapOn:
          id: Skip Backward
- assertVisible: '0:00 elapsed'
- tapOn: '(Open|Replace) subtitles'
- tapOn: Browse
- runFlow:
    when:
      visible:
        id: 'DOC.sidebar.item.On My iPhone'
    commands:
      - tapOn:
          id: 'DOC.sidebar.item.On My iPhone'
      - extendedWaitUntil:
          visible:
            id: '(mLearn v3 Dev, Container|M01 fixtures, Folder|m01-watch, mp4)'
          timeout: 15000
- runFlow:
    when:
      visible:
        id: 'mLearn v3 Dev, Container'
    commands:
      - tapOn:
          id: 'mLearn v3 Dev, Container'
      - extendedWaitUntil:
          visible:
            id: 'M01 fixtures, Folder'
          timeout: 15000
- runFlow:
    when:
      visible:
        id: 'M01 fixtures, Folder'
    commands:
      - tapOn:
          id: 'M01 fixtures, Folder'
      - extendedWaitUntil:
          visible:
            id: 'm01-watch, mp4'
          timeout: 15000
- tapOn:
    id: 'm01-watch.srt, srt'
    enabled: true
    point: 50%, 25%

appId: net.kikan.mlearn.v3dev
---
# Tap inside the video, above the central play button, to reveal AVKit's transport.
- runFlow:
    when:
      notVisible:
        id: Play/Pause
    commands:
      - tapOn:
          point: 50%, 45%
- tapOn:
    id: Play/Pause
- extendedWaitUntil:
    visible: 'came: untracked'
    timeout: 25000
- tapOn: 'Children: mixed'
- extendedWaitUntil:
    visible: child
    timeout: 15000
- tapOn: Close Inspector
- runFlow:
    when:
      notVisible:
        id: Play/Pause
    commands:
      - tapOn:
          point: 50%, 45%
- assertVisible: Play
- takeScreenshot: native-played-frame
# AVKit uses ten-second skips. Reset then seek to an exact paused checkpoint.
- repeat:
    times: 3
    commands:
      - tapOn:
          id: Skip Backward
- assertVisible: '0:00 elapsed'
# AVKit seeks asynchronously; wait for each checkpoint before the next skip.
- tapOn:
    id: Skip Forward
- extendedWaitUntil:
    visible: '0:10 elapsed'
    timeout: 15000
- tapOn:
    id: Skip Forward
- extendedWaitUntil:
    visible: '0:20 elapsed'
    timeout: 15000
- extendedWaitUntil:
    visible: 'came: untracked'
    timeout: 15000
- assertVisible: 'Children: mixed'
- assertVisible: Play
- takeScreenshot: native-paused-seek
- tapOn: Home
- assertVisible: '20s · org.mlearn.english · subtitles attached'
- stopApp
- launchApp:
    clearState: false
    permissions: {}
- tapOn: Resume m01-watch.mp4
- extendedWaitUntil:
    visible: 'came: untracked'
    timeout: 15000
- assertVisible: 'Children: mixed'
- runFlow:
    when:
      notVisible:
        id: Play/Pause
    commands:
      - tapOn:
          point: 50%, 45%
- assertVisible: '0:20 elapsed'
- assertVisible: Play
- takeScreenshot: native-restart-source-position

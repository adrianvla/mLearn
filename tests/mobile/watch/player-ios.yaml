appId: net.kikan.mlearn.v3dev
---
# Reveal above AVKit's central play target, relative to the actual media view.
- runFlow:
    when:
      notVisible:
        id: Play/Pause
    commands:
      - tapOn:
          text: Local video player
          point: 50%, 38%
# Controls must respond to input, not merely be present after source loading.
- assertVisible: Play
- tapOn:
    text: Local video player
    point: 50%, 38%
- assertNotVisible:
    id: Play/Pause
- tapOn:
    text: Local video player
    point: 50%, 38%
- assertVisible:
    id: Play/Pause
- assertVisible: Play
# The app toolbar must not cover AVKit's fullscreen control.
- tapOn:
    id: Fullscreen Button
- runFlow:
    when:
      notVisible:
        id: Close Button
    commands:
      - tapOn:
          point: 50%, 38%
- assertVisible:
    id: Close Button
- tapOn:
    id: Close Button
- assertVisible: Home
- assertVisible: 'Children: mixed'
- runFlow:
    when:
      notVisible:
        id: Play/Pause
    commands:
      - tapOn:
          text: Local video player
          point: 50%, 38%
- tapOn:
    id: Play/Pause
- extendedWaitUntil:
    visible: 'came: untracked'
    timeout: 25000
- tapOn: 'Children: mixed'
- extendedWaitUntil:
    visible: child
    timeout: 15000
- tapOn: Close Inspector
- runFlow:
    when:
      notVisible:
        id: Play/Pause
    commands:
      - tapOn:
          text: Local video player
          point: 50%, 38%
- assertVisible: Play
- takeScreenshot: native-played-frame
# AVKit uses ten-second skips. Reset then seek to an exact paused checkpoint.
- repeat:
    times: 3
    commands:
      - tapOn:
          id: Skip Backward
- assertVisible: '0:00 elapsed'
# AVKit seeks asynchronously; wait for each checkpoint before the next skip.
- tapOn:
    id: Skip Forward
- extendedWaitUntil:
    visible: '0:10 elapsed'
    timeout: 15000
- tapOn:
    id: Skip Forward
- extendedWaitUntil:
    visible: '0:20 elapsed'
    timeout: 15000
- extendedWaitUntil:
    visible: 'came: untracked'
    timeout: 15000
- assertVisible: 'Children: mixed'
- assertVisible: Play
- takeScreenshot: native-paused-seek
- tapOn: Home
- assertVisible: '0:20 · English · Subtitles'
- stopApp
- launchApp:
    clearState: false
    permissions: {}
- tapOn: Resume m01-watch.mp4
- extendedWaitUntil:
    visible: 'came: untracked'
    timeout: 15000
- assertVisible: 'Children: mixed'
- runFlow:
    when:
      notVisible:
        id: Play/Pause
    commands:
      - tapOn:
          text: Local video player
          point: 50%, 38%
- assertVisible: '0:20 elapsed'
- assertVisible: Play
- takeScreenshot: native-restart-source-position

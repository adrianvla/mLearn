appId: net.kikan.mlearn.v3dev
name: Reopen exact seeded Practice through native Review
---
- extendedWaitUntil:
    visible:
      id: source-language-select
      enabled: true
    timeout: 60000
- tapOn: Review
- scrollUntilVisible:
    element: Open Word Practice m11-native-grammar
    direction: DOWN
    timeout: 30000
- tapOn: Open Word Practice m11-native-grammar

[package]
name = "mlearn-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "mLearn universal application desktop host"
license-file = "../../../LICENSE"
[lib]
name = "mlearn_desktop"
crate-type = ["rlib"]
[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }
[dependencies]
mlearn-runtime = { path = "../../../crates/runtime" }
mlearn-language-host = { path = "../../../crates/language-host" }
serde_json.workspace = true
tokio = { version = "1", features = ["sync"] }
tauri = { version = "2.12.3", features = [] }

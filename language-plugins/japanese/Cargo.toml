[package]
name = "mlearn-japanese-engine"
version = "0.1.0"
edition = "2021"
license-file = "../../LICENSE"
publish = false

# Keep the plugin's dependency resolution out of the application's Cargo.lock.
[workspace]
resolver = "2"
members = ["vendor/sudachi"]

[dependencies]
mlearn-language-sdk = { path = "../../crates/language-sdk" }
mlearn-core = { path = "../../crates/core" }
sudachi = { path = "vendor/sudachi" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
miniz_oxide = "=0.8.9"
unicode-normalization = "0.1"

[lib]
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
serde_json = "1"
stats_alloc = "=0.1.10"

[profile.release]
lto = "thin"
codegen-units = 1

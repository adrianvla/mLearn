# Adapted from Sudachi 0.6.11, commit 90fd6068c80c2fc3b63e0dbab0e341475bad4d8f.
# Portable feature removes host storage and DSO loading, not linguistic algorithms.
[package]
name = "sudachi"
version = "0.6.11"
authors = ["Works Applications <sudachi@worksap.co.jp>"]
edition = "2021"
rust-version = "1.74.1"
description = "Rust version of Sudachi, the Japanese Morphological Analyzer"
repository = "https://github.com/WorksApplications/sudachi.rs"
license = "Apache-2.0"
publish = false

[features]
default = ["portable"]
portable = []
native = ["dep:libloading", "dep:memmap2"]

[dependencies]
aho-corasick = "1"
bitflags = "2.5"
csv = "1.3"
fancy-regex = "0.13"
indexmap = "2.2"
itertools = "0.13"
lazy_static = "1.4"
libloading = { version = "0.8", optional = true }
memmap2 = { version = "0.9", optional = true }
nom = "7"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
unicode-normalization = "0.1"
yada = "0.5"

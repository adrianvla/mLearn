[package]
name = "mlearn-language-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file = "../../LICENSE"
[dependencies]
rusqlite = { version="0.37", features=["bundled"] }
mlearn-language-sdk = { path = "../language-sdk" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
# Validation is mandatory for downloaded modules. Auto-dispatch avoids tail-call
# stack growth in unoptimized/debug builds while retaining optimized release dispatch.
wasmi = { version = "2", default-features = false, features = ["std", "validate", "stable", "auto-dispatch"] }
[dev-dependencies]
wat = "1"
tempfile="3"

[package]
name = "mlearn-language-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file = "../../LICENSE"
[dependencies]
rusqlite = { version="0.37", features=["bundled"] }
mlearn-language-sdk = { path = "../language-sdk" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
tempfile = "3"
# Validation is mandatory. Portable dispatch does not rely on LLVM eliminating
# recursive handler calls when optimizing with development safety checks.
wasmi = { version = "2", default-features = false, features = ["std", "validate", "stable", "portable-dispatch"] }
[dev-dependencies]
wat = "1"
tempfile="3"

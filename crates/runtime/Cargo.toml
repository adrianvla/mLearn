[package]
name = "mlearn-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file = "../../LICENSE"
[dependencies]
mlearn-core = { path = "../core" }
mlearn-storage = { path = "../storage" }
mlearn-language-host = { path = "../language-host" }
mlearn-document-parser = { path = "../document-parser" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tempfile = "3"
atomicwrites = "=0.4.4"
base64 = "0.22"
ed25519-dalek = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["rt", "sync", "macros", "net", "time"] }
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "android")'.dependencies]
rustix = { version = "1.1.5", features = ["fs"] }

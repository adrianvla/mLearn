[package]
name = "mlearn-document-parser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file = "../../LICENSE"

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "=0.42.0"
percent-encoding = "2"
cssparser = "=0.37.0"
mlearn-language-host = { path = "../language-host" }
mlearn-document-pdf-guest = { path = "../document-pdf-guest" }

[dev-dependencies]
lopdf = { version = "=0.46.0", default-features = false }
wat = "1"

[workspace]
resolver = "2"
members = ["crates/core", "crates/storage", "crates/language-sdk", "crates/language-host", "crates/runtime", "crates/ffi", "tools/bindgen", "language-plugins/hello", "language-plugins/english", "apps/desktop/src-tauri"]
default-members = ["crates/core", "crates/storage", "crates/language-sdk", "crates/language-host", "crates/runtime"]

[workspace.package]
version = "3.0.0-dev.0"
edition = "2024"
rust-version = "1.90"
license-file = "LICENSE"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
uniffi = "0.32"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# The interpreter, support crates and host-State monomorphizations all participate
# in guest execution. Keep symbols, assertions and overflow checks while optimizing
# them; language-host selects bounded loop dispatch even at this optimization level.
[profile.dev.package.wasmi]
opt-level = 3
debug = 2
debug-assertions = true
overflow-checks = true

[profile.dev.package.mlearn-language-host]
opt-level = 3
debug = 2
debug-assertions = true
overflow-checks = true

[profile.dev.package.wasmi_core]
opt-level = 3
debug = 2
debug-assertions = true
overflow-checks = true

[profile.dev.package.wasmi_ir]
opt-level = 3
debug = 2
debug-assertions = true
overflow-checks = true

[profile.dev.package.wasmi_collections]
opt-level = 3
debug = 2
debug-assertions = true
overflow-checks = true

# Streaming authentication of supported language resources must remain usable
# during normal development. Retain symbols, assertions and overflow checks.
[profile.dev.package.sha2]
opt-level = 3
debug = 2
debug-assertions = true
overflow-checks = true
